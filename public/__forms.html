<!--
  Static form definition for Netlify Forms detection.
  Netlify scans this file at deploy time and registers the "contact" form
  with the fields below. The live form is the React component in
  src/components/contact/ContactForm.tsx, which POSTs to Netlify at runtime.
  Field names here MUST match the names in that component.
-->
<html>
  <head>
    <title>Netlify form definitions</title>
  </head>
  <body>
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="business" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <input type="text" name="domain" />
      <input type="text" name="budget" />
      <input type="text" name="interest" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
